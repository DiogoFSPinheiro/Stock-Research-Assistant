[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-research-assistant"
version = "0.1.0"
description = "Research-first Telegram assistant for company analysis and undervalued stock discovery."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Codex"}]
dependencies = [
    "yfinance>=0.2.54",
]

[project.scripts]
stock-research-assistant = "stock_research_assistant.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
