[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xtb-trading-bot"
version = "0.1.0"
description = "Signal-only Telegram bot for stocks and FX trade ideas."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Codex"}]
dependencies = [
    "yfinance>=0.2.54",
]

[project.scripts]
xtb-trading-bot = "xtb_trading_bot.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
